# Optional Render Blueprint. Render Dashboard -> New + -> Blueprint -> pick this repo.
# MONGODB_URI is NOT stored here: Render asks you for it (sync: false).
services:
  - type: web
    name: face-recognition
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && sh scripts/download_models.sh
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false
