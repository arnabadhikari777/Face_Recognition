<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2457d6">
  <link rel="icon" href="data:,">
  <title>Face Recognition</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="app">
  <h1>Face Recognition</h1>
  <p class="sub">Register a face or check whether a face is already registered.</p>

  <div id="home" class="actions">
    <button id="btn-register" class="btn primary" type="button">Register Face</button>
    <button id="btn-recognize" class="btn" type="button">Recognize Face</button>
  </div>

  <section id="workflow" hidden aria-labelledby="workflow-title">
    <h2 id="workflow-title"></h2>

    <div id="setup">
      <label id="name-field" class="field" hidden>
        <span>Name</span>
        <input id="name-input" type="text" maxlength="60" autocomplete="off" placeholder="Name of the person">
      </label>
      <label class="check">
        <input id="consent" type="checkbox">
        <span id="consent-text"></span>
      </label>
      <button id="start-btn" class="btn primary" type="button">Start Camera</button>
    </div>

    <div id="loading" class="loading" hidden>
      <progress id="load-progress" max="100"></progress>
      <p id="loading-text">Loading…</p>
    </div>

    <div id="camera-area" hidden>
      <div class="video-wrap"><video id="preview" playsinline muted autoplay></video></div>
      <p id="instruction" class="instruction"></p>
      <progress id="capture-progress" max="3" value="0" hidden></progress>
      <p id="hint" class="hint" aria-live="polite"></p>
      <div class="row">
        <button id="capture-btn" class="btn primary" type="button">Capture</button>
        <button id="switch-btn" class="btn" type="button" hidden>Switch Camera</button>
      </div>
    </div>

    <div id="processing" class="loading" hidden>
      <progress></progress>
      <p id="processing-text">Processing…</p>
    </div>

    <div id="result" class="result" role="status" hidden></div>
    <div id="error" class="error" role="alert" hidden></div>

    <button id="close-btn" class="btn link" type="button">Close</button>
  </section>

  <p class="privacy">Camera images are processed in your browser and are never uploaded or stored.
    Only a numeric face template is sent to the server. Only register or check people who have given their permission.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
